# -----------------------------------------------
# Spring Mail (SMTP via Gmail)
# Set these as environment variables — NEVER hardcode credentials here.
# How to set env vars:
#   Windows PowerShell: $env:MAIL_USERNAME="you@gmail.com" ; $env:MAIL_PASSWORD="yourapppassword"
#   Linux/Mac:          export MAIL_USERNAME=you@gmail.com && export MAIL_PASSWORD=yourapppassword
# -----------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend URL (used to build verification / reset links)
